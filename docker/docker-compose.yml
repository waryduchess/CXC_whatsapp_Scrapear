version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_comprobantes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: finanzas
      MYSQL_USER: usuario_app
      MYSQL_PASSWORD: password_app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data: